name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Contact form script (PHP syntax and behaviour)
        run: |
          php -l public/contact.php
          python3 scripts/test-contact.py
      - run: npm run build
      - name: Static export (cPanel) still builds
        run: npm run build:static
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.example.test
